_registry_statuses:
  - canonical_source
  - source_for_vnext
  - legacy_reference
  - stale
  - archive_candidate

_conventions:
  pattern_name_is_not_meaning_engine: true
  pattern_name_source_rule: "pattern_name = canonical_node.label"
  pattern_name_rules:
    max_per_period_block: 1
    max_per_daily_block: 0
    max_per_chart_total: 5
    reuse_pattern: "1 kez konur, sonra 'o kalıp' / 'bu tarafın' ile geri çağrılır"
  pattern_name_lint_fail_cases:
    - "Ay-Merkür gerilimi"
    - "12. ev projeksiyonu"
    - "mükemmeliyetçilik"
    - "Satürnyen disiplin"
    - "Kaçınmacı bağlanma stili"

