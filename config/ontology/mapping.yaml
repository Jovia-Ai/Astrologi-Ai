  \"modifiers\": [
    {
      \"if\": {\"axis\": [\"1-7\"]},
      \"add\": {
        \"boundary\": 0.2,
        \"intimacy_trust\": 0.15
      }
    },
    {
      \"if\": {\"axis\": [\"4-10\"]},
      \"add\": {
        \"security\": 0.2,
        \"evaluation_standards\": 0.15
      }
    },
    {
      \"if\": {\"object\": \"chart_ruler\"},
