      {
        \"pair\": [\"duty\", \"order_optimization\"],
        \"prefer\": {
          \"if_house\": 6,
          \"else\": \"duty\"
        }
      }
    ],
    \"selection\": {
      \"rule\": \"highest_total_score\",
      \"tie_breaker\": [
        \"higher_base_score\",
        \"signal_score\",
        \"deterministic_hash\"
